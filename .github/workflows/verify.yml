name: Verify Portfolio

on:
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  site-build:
    name: Jekyll site build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Build with GitHub Pages Jekyll
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site

  public-portfolio:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Verify evidence, links, states, and public text
        run: python -B -m unittest discover -s tests -p "test_*.py" -v

  java-projects:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Spring Security auth bridge
            project: 02_projects/case-study-samples/spring-security-auth-bridge
          - name: OpsMate Local
            project: 02_projects/opsmate-local
    defaults:
      run:
        working-directory: ${{ matrix.project }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: ${{ matrix.project }}/pom.xml

      - name: Verify with Maven Wrapper
        run: |
          chmod +x mvnw
          ./mvnw -q clean verify

  opsmate-container:
    name: OpsMate container and runbook assets
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: 02_projects/opsmate-local
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Validate shell syntax
        run: |
          sh -n deploy/open-demo.sh deploy/close-demo.sh deploy/emergency-close.sh deploy/smoke-test.sh deploy/verify-closed.sh
          sh -n deploy/postgres/init-roles.sh deploy/tunnel/tunnel-entrypoint.sh

      - name: Validate Compose configuration and isolation
        run: |
          docker compose --env-file deploy/.env.example --file deploy/compose.yml config --quiet
          docker compose --env-file deploy/.env.example --file deploy/compose.yml config --format json > /tmp/opsmate-compose.json
          python3 - <<'PY'
          import json

          with open('/tmp/opsmate-compose.json', encoding='utf-8') as handle:
              compose = json.load(handle)

          services = compose['services']
          edge_ports = services['edge'].get('ports', [])
          if len(edge_ports) != 1:
              raise SystemExit(f'edge must publish exactly one loopback port, got {edge_ports!r}')
          edge_port = edge_ports[0]
          if edge_port.get('host_ip') != '127.0.0.1':
              raise SystemExit(f'edge host_ip must be 127.0.0.1, got {edge_port!r}')
          if str(edge_port.get('target')) != '8080':
              raise SystemExit(f'edge target must be 8080, got {edge_port!r}')
          if str(edge_port.get('published')) != '18083':
              raise SystemExit(f'CI fixture edge port must be 18083, got {edge_port!r}')

          for name in ('db', 'app', 'model-tunnel', 'tunnel-secret-init'):
              if services[name].get('ports'):
                  raise SystemExit(f'{name} must not publish a host port')

          app_networks = set(services['app'].get('networks', {}))
          edge_networks = set(services['edge'].get('networks', {}))
          tunnel_networks = set(services['model-tunnel'].get('networks', {}))
          if 'tunnel_egress' in app_networks:
              raise SystemExit('app must not have direct tunnel/internet egress')
          if 'edge_ingress' in app_networks:
              raise SystemExit('app must not attach to the host-ingress bridge')
          if edge_networks != {'edge_to_app', 'edge_ingress'}:
              raise SystemExit(f'edge must use only edge_to_app and edge_ingress: {edge_networks!r}')
          if not {'model_link', 'tunnel_egress'} <= tunnel_networks:
              raise SystemExit(f'model-tunnel networks are incomplete: {tunnel_networks!r}')
          if not compose['networks']['model_link'].get('internal'):
              raise SystemExit('model_link must be internal')
          if not compose['networks']['app_to_db'].get('internal'):
              raise SystemExit('app_to_db must be internal')
          if not compose['networks']['edge_to_app'].get('internal'):
              raise SystemExit('edge_to_app must be internal')

          edge_ingress = compose['networks'].get('edge_ingress', {})
          if edge_ingress.get('internal'):
              raise SystemExit('edge_ingress must not be Docker internal; Synology drops published ports on internal-only networks')
          if edge_ingress.get('driver') not in (None, 'bridge'):
              raise SystemExit(f'edge_ingress must use bridge driver: {edge_ingress!r}')
          opts = edge_ingress.get('driver_opts', {})
          if str(opts.get('com.docker.network.bridge.enable_ip_masquerade')).lower() != 'false':
              raise SystemExit(f'edge_ingress must disable IP masquerade: {opts!r}')

          secret_init = services['tunnel-secret-init']
          if str(secret_init.get('user')) != '0:0':
              raise SystemExit(f'tunnel-secret-init must use explicit root only for bounded copy/chown: {secret_init.get("user")!r}')
          if secret_init.get('network_mode') != 'none':
              raise SystemExit(f'tunnel-secret-init must have network_mode none: {secret_init.get("network_mode")!r}')
          if set(secret_init.get('cap_drop', [])) != {'ALL'}:
              raise SystemExit(f'tunnel-secret-init must drop all ambient caps: {secret_init.get("cap_drop")!r}')
          init_caps = set(secret_init.get('cap_add', []))
          if init_caps != {'DAC_READ_SEARCH', 'CHOWN'}:
              raise SystemExit(f'tunnel-secret-init capability set is too broad or incomplete: {init_caps!r}')
          if not secret_init.get('read_only'):
              raise SystemExit('tunnel-secret-init root filesystem must be read-only')

          tunnel_dep = services['model-tunnel'].get('depends_on', {}).get('tunnel-secret-init', {})
          if tunnel_dep.get('condition') != 'service_completed_successfully':
              raise SystemExit(f'model-tunnel must wait for successful secret initialization: {tunnel_dep!r}')
          tunnel_secret_mounts = [
              mount for mount in services['model-tunnel'].get('volumes', [])
              if mount.get('target') == '/run/secrets'
          ]
          if len(tunnel_secret_mounts) != 1:
              raise SystemExit(f'model-tunnel must have exactly one /run/secrets volume: {tunnel_secret_mounts!r}')
          tunnel_secret_mount = tunnel_secret_mounts[0]
          if tunnel_secret_mount.get('type') != 'volume' or not tunnel_secret_mount.get('read_only'):
              raise SystemExit(f'model-tunnel secret volume must be read-only: {tunnel_secret_mount!r}')
          if compose.get('secrets'):
              raise SystemExit('Compose file-secrets must not be used for the NAS tunnel key because bind ownership is preserved')
          PY

      - name: Validate loopback Nginx edge configuration
        run: |
          grep -Fq 'limit_req zone=opsmate_global' deploy/nginx.conf
          grep -Fq 'limit_req_status 429' deploy/nginx.conf
          docker run --rm \
            --user 101:101 \
            --tmpfs /tmp:size=16m,mode=1777 \
            -v "$PWD/deploy/nginx.conf:/etc/nginx/nginx.conf:ro" \
            nginx:1.30.4-alpine@sha256:97d490c12ba55b4946b01546d1c3ed324e8d41ab1c9fcb2a616aa470620e5b46 \
            nginx -t -c /etc/nginx/nginx.conf

      - name: Build non-root application and tunnel images
        run: |
          docker build --check .
          docker build --tag opsmate-local:ci .
          test "$(docker image inspect --format '{{.Config.User}}' opsmate-local:ci)" = "opsmate:opsmate"

          docker build --check --file deploy/tunnel/Dockerfile deploy/tunnel
          docker build --tag opsmate-model-tunnel:ci --file deploy/tunnel/Dockerfile deploy/tunnel
          test "$(docker image inspect --format '{{.Config.User}}' opsmate-model-tunnel:ci)" = "tunnel:tunnel"
          docker run --rm --entrypoint nginx opsmate-model-tunnel:ci -t -c /etc/nginx/tunnel-nginx.conf

      - name: Validate tunnel SSH trust and HTTP host normalization
        run: |
          grep -Fq -- '-o StrictHostKeyChecking=yes' deploy/tunnel/tunnel-entrypoint.sh
          grep -Fq -- '-o HostKeyAlgorithms=ssh-ed25519' deploy/tunnel/tunnel-entrypoint.sh
          grep -Fq -- '-o UserKnownHostsFile="$KNOWN_HOSTS"' deploy/tunnel/tunnel-entrypoint.sh
          grep -Fq -- '-L 127.0.0.1:11435:127.0.0.1:11434' deploy/tunnel/tunnel-entrypoint.sh
          grep -Fq 'listen 11434;' deploy/tunnel/tunnel-nginx.conf
          grep -Fq 'proxy_set_header Host 127.0.0.1:11434;' deploy/tunnel/tunnel-nginx.conf
          grep -Fq 'proxy_pass http://127.0.0.1:11435;' deploy/tunnel/tunnel-nginx.conf

      - name: Verify tunnel entrypoint rejects unsafe target input
        run: |
          if docker run --rm \
            -e OFFICE_SSH_HOST='bad host' \
            -e OFFICE_SSH_PORT=22 \
            -e OFFICE_SSH_USER=test \
            opsmate-model-tunnel:ci; then
            echo 'tunnel entrypoint accepted an unsafe host' >&2
            exit 1
          fi

      - name: Rehearse UID-10001 tunnel secret staging
        run: |
          set -euo pipefail
          project=opsmate-ci-secrets
          secret_volume="${project}-tunnel-secrets"
          cleanup() {
            COMPOSE_PROJECT_NAME="$project" docker compose --project-name "$project" \
              --env-file deploy/.env.example --file deploy/compose.yml \
              down --volumes --remove-orphans >/dev/null 2>&1 || true
            docker volume rm "$secret_volume" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          COMPOSE_PROJECT_NAME="$project" docker compose --project-name "$project" \
            --env-file deploy/.env.example --file deploy/compose.yml \
            up --abort-on-container-exit --exit-code-from tunnel-secret-init tunnel-secret-init

          docker run --rm --user 10001:10001 --network none \
            -v "$secret_volume:/run/secrets:ro" \
            alpine:3.21.3@sha256:1c4eef651f65e2f7daee7ee785882ac164b02b78fb74503052a26dc061c90474 \
            /bin/sh -ec '
              test -r /run/secrets/office_tunnel_key
              test -r /run/secrets/office_known_hosts
              test "$(stat -c "%u:%g:%a" /run/secrets/office_tunnel_key)" = "10001:10001:600"
              test "$(stat -c "%u:%g:%a" /run/secrets/office_known_hosts)" = "10001:10001:600"
            '

          cleanup
          trap - EXIT

      - name: Rehearse the one-shot migration container
        env:
          OPSMATE_APP_IMAGE: opsmate-local:ci
          OPSMATE_TUNNEL_IMAGE: opsmate-model-tunnel:ci
        run: |
          docker compose --project-name opsmate-ci-rehearsal \
            --env-file deploy/.env.example \
            --file deploy/compose.yml \
            up --no-build --abort-on-container-exit --exit-code-from migrate migrate

      - name: Remove one-shot rehearsal resources
        if: always()
        env:
          OPSMATE_APP_IMAGE: opsmate-local:ci
          OPSMATE_TUNNEL_IMAGE: opsmate-model-tunnel:ci
        run: |
          docker compose --project-name opsmate-ci-rehearsal \
            --env-file deploy/.env.example \
            --file deploy/compose.yml \
            down --volumes --remove-orphans
