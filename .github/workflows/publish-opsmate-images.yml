name: Publish OpsMate Images

on:
  push:
    branches: [main]
    paths:
      - '02_projects/opsmate-local/Dockerfile'
      - '02_projects/opsmate-local/pom.xml'
      - '02_projects/opsmate-local/.mvn/**'
      - '02_projects/opsmate-local/src/**'
      - '02_projects/opsmate-local/deploy/tunnel/**'
      - '.github/workflows/publish-opsmate-images.yml'
  workflow_dispatch:
  issues:
    types: [opened]

permissions:
  contents: read
  packages: write
  issues: write

concurrency:
  group: opsmate-image-publish-${{ github.repository }}
  cancel-in-progress: false

jobs:
  publish:
    if: github.event_name != 'issues' || github.event.issue.title == '[opsmate-image-publish]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout main
        uses: actions/checkout@v6
        with:
          ref: main

      - name: Resolve source commit
        id: source
        shell: bash
        run: |
          set -euo pipefail
          source_sha="$(git rev-parse HEAD)"
          [[ "$source_sha" =~ ^[0-9a-f]{40}$ ]]
          echo "sha=$source_sha" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        id: login
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish application image
        id: app
        uses: docker/build-push-action@v6
        with:
          context: ./02_projects/opsmate-local
          platforms: linux/amd64
          push: true
          provenance: true
          sbom: true
          tags: ghcr.io/son1004007/opsmate-local:${{ steps.source.outputs.sha }}

      - name: Publish model tunnel image
        id: tunnel
        uses: docker/build-push-action@v6
        with:
          context: ./02_projects/opsmate-local/deploy/tunnel
          platforms: linux/amd64
          push: true
          provenance: true
          sbom: true
          tags: ghcr.io/son1004007/opsmate-model-tunnel:${{ steps.source.outputs.sha }}

      - name: Verify immutable pulls
        id: verify
        env:
          APP_DIGEST: ${{ steps.app.outputs.digest }}
          TUNNEL_DIGEST: ${{ steps.tunnel.outputs.digest }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$APP_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          [[ "$TUNNEL_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          app_ref="ghcr.io/son1004007/opsmate-local@${APP_DIGEST}"
          tunnel_ref="ghcr.io/son1004007/opsmate-model-tunnel@${TUNNEL_DIGEST}"
          docker pull --platform linux/amd64 "$app_ref" >/dev/null
          docker pull --platform linux/amd64 "$tunnel_ref" >/dev/null
          docker image inspect "$app_ref" >/dev/null
          docker image inspect "$tunnel_ref" >/dev/null
          echo "app_ref=$app_ref" >> "$GITHUB_OUTPUT"
          echo "tunnel_ref=$tunnel_ref" >> "$GITHUB_OUTPUT"

      - name: Record release digests
        if: success()
        env:
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
          APP_REF: ${{ steps.verify.outputs.app_ref }}
          TUNNEL_REF: ${{ steps.verify.outputs.tunnel_ref }}
        shell: bash
        run: |
          set -euo pipefail
          {
            echo '## OpsMate immutable images'
            echo
            echo "Source commit: \`$SOURCE_SHA\`"
            echo
            echo "- Application: \`$APP_REF\`"
            echo "- Model tunnel: \`$TUNNEL_REF\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Report controlled publish result
        if: always() && github.event_name == 'issues'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
          APP_REF: ${{ steps.verify.outputs.app_ref }}
          TUNNEL_REF: ${{ steps.verify.outputs.tunnel_ref }}
          LOGIN_OUTCOME: ${{ steps.login.outcome }}
          APP_OUTCOME: ${{ steps.app.outcome }}
          TUNNEL_OUTCOME: ${{ steps.tunnel.outcome }}
          VERIFY_OUTCOME: ${{ steps.verify.outcome }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "$VERIFY_OUTCOME" = success ]; then
            body=$(cat <<EOF
## OpsMate image publish result

- status: SUCCESS
- source_commit: \`$SOURCE_SHA\`
- application: \`$APP_REF\`
- model_tunnel: \`$TUNNEL_REF\`
- immutable_pull_verify: PASS
EOF
)
          else
            body=$(cat <<EOF
## OpsMate image publish result

- status: FAILED
- source_commit: \`${SOURCE_SHA:-unknown}\`
- registry_login: \`$LOGIN_OUTCOME\`
- application_publish: \`$APP_OUTCOME\`
- tunnel_publish: \`$TUNNEL_OUTCOME\`
- immutable_pull_verify: \`$VERIFY_OUTCOME\`

No credential values are included. Inspect the workflow job logs for the failing fixed step.
EOF
)
          fi
          gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body "$body"

      - name: Enforce publish success
        if: always()
        env:
          LOGIN_OUTCOME: ${{ steps.login.outcome }}
          APP_OUTCOME: ${{ steps.app.outcome }}
          TUNNEL_OUTCOME: ${{ steps.tunnel.outcome }}
          VERIFY_OUTCOME: ${{ steps.verify.outcome }}
        shell: bash
        run: |
          set -euo pipefail
          [ "$LOGIN_OUTCOME" = success ]
          [ "$APP_OUTCOME" = success ]
          [ "$TUNNEL_OUTCOME" = success ]
          [ "$VERIFY_OUTCOME" = success ]
