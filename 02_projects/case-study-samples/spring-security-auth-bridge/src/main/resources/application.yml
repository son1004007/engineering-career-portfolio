spring:
  application:
    name: spring-security-auth-bridge
  jackson:
    deserialization:
      fail-on-unknown-properties: true

server:
  error:
    include-message: never
    include-stacktrace: never
  servlet:
    session:
      timeout: 30m
      cookie:
        http-only: true
        same-site: strict

app:
  sso:
    expected-issuer: ${APP_SSO_EXPECTED_ISSUER:portfolio-demo-idp}
    expected-audience: ${APP_SSO_EXPECTED_AUDIENCE:spring-security-auth-bridge}
    active-key-id: ${APP_SSO_ACTIVE_KEY_ID:demo-key-v1}
    max-age: 2m
    max-future-skew: 10s
