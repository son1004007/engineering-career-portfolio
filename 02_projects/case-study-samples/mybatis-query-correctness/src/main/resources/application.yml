spring:
  application:
    name: mybatis-query-correctness
  datasource:
    url: jdbc:h2:mem:querycase;MODE=Oracle;DB_CLOSE_DELAY=-1;DATABASE_TO_UPPER=true
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  sql:
    init:
      mode: always

mybatis:
  mapper-locations: classpath:/mappers/*.xml
  configuration:
    map-underscore-to-camel-case: true
