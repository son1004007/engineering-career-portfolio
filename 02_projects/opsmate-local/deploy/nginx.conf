pid /tmp/nginx.pid;
error_log /dev/stderr notice;

events {
    worker_connections 256;
}

http {
    access_log /dev/stdout;
    client_body_temp_path /tmp/client_body;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;

    # DSM is the Internet-facing TLS reverse proxy. The OpsMate edge is bound only
    # to NAS loopback, so a global anonymous limit is deliberately used here rather
    # than trusting a client-controlled forwarding header as the rate-limit key.
    limit_req_zone $server_name zone=opsmate_global:1m rate=5r/s;
    limit_req_status 429;

    resolver 127.0.0.11 ipv6=off valid=10s;

    server {
        listen 8080;
        server_name _;

        client_max_body_size 16k;
        server_tokens off;

        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Cache-Control "no-store" always;
        add_header X-OpsMate-Demo "live" always;

        location = /edge-health {
            access_log off;
            add_header Content-Type text/plain;
            return 200 "ok\n";
        }

        location ^~ /actuator/ {
            return 404;
        }

        location / {
            limit_req zone=opsmate_global burst=20 nodelay;

            set $opsmate_backend app:8080;
            proxy_pass http://$opsmate_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-Port $http_x_forwarded_port;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header Connection "";

            proxy_connect_timeout 3s;
            proxy_send_timeout 90s;
            proxy_read_timeout 90s;
        }
    }
}
