name: ${COMPOSE_PROJECT_NAME:-opsmate-demo}

x-logging: &bounded-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  db:
    image: postgres:16.8-alpine@sha256:3b057e1c2c6dfee60a30950096f3fab33be141dbb0fdd7af3d477083de94166c
    restart: "no"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      POSTGRES_USER: ${POSTGRES_ADMIN_USER:?POSTGRES_ADMIN_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:?POSTGRES_ADMIN_PASSWORD is required}
      OPSMATE_DB_MIGRATION_USER: ${OPSMATE_DB_MIGRATION_USER:?OPSMATE_DB_MIGRATION_USER is required}
      OPSMATE_DB_MIGRATION_PASSWORD: ${OPSMATE_DB_MIGRATION_PASSWORD:?OPSMATE_DB_MIGRATION_PASSWORD is required}
      OPSMATE_DB_APP_USER: ${OPSMATE_DB_APP_USER:?OPSMATE_DB_APP_USER is required}
      OPSMATE_DB_APP_PASSWORD: ${OPSMATE_DB_APP_PASSWORD:?OPSMATE_DB_APP_PASSWORD is required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init-roles.sh:/docker-entrypoint-initdb.d/10-init-opsmate-roles.sh:ro
    networks:
      - app_to_db
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
    security_opt:
      - no-new-privileges:true
    logging: *bounded-logging

  migrate:
    image: ${OPSMATE_APP_IMAGE:?OPSMATE_APP_IMAGE digest is required}
    command: ["--opsmate-migrate-only"]
    restart: "no"
    environment:
      OPSMATE_DB_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:?POSTGRES_DB is required}
      OPSMATE_FLYWAY_USERNAME: ${OPSMATE_DB_MIGRATION_USER:?OPSMATE_DB_MIGRATION_USER is required}
      OPSMATE_FLYWAY_PASSWORD: ${OPSMATE_DB_MIGRATION_PASSWORD:?OPSMATE_DB_MIGRATION_PASSWORD is required}
      OPSMATE_FLYWAY_APP_ROLE: ${OPSMATE_DB_APP_USER:?OPSMATE_DB_APP_USER is required}
    networks:
      - app_to_db
    depends_on:
      db:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    logging: *bounded-logging

  # Compose file-based secrets are bind mounts on non-Swarm Docker and retain
  # host UID/mode. Synology keeps the Office SSH key 0600 under the NAS user, so
  # the fixed UID 10001 tunnel must never receive that bind directly. This
  # networkless one-shot helper reads the host-owned inputs with only the
  # capabilities needed for read/chown and writes UID-10001, mode-0600 copies
  # into a short-lived Docker volume. The real tunnel mounts that volume read-only.
  tunnel-secret-init:
    image: alpine:3.21.3@sha256:1c4eef651f65e2f7daee7ee785882ac164b02b78fb74503052a26dc061c90474
    restart: "no"
    user: "0:0"
    command:
      - /bin/sh
      - -ec
      - |
        umask 077
        cp /source/office_tunnel_key /target/office_tunnel_key
        cp /source/office_known_hosts /target/office_known_hosts
        chmod 0600 /target/office_tunnel_key /target/office_known_hosts
        chown 10001:10001 /target/office_tunnel_key /target/office_known_hosts
        test "$$(stat -c '%u:%g:%a' /target/office_tunnel_key)" = "10001:10001:600"
        test "$$(stat -c '%u:%g:%a' /target/office_known_hosts)" = "10001:10001:600"
    volumes:
      - type: bind
        source: ${OPSMATE_OFFICE_SSH_KEY_FILE:?OPSMATE_OFFICE_SSH_KEY_FILE is required}
        target: /source/office_tunnel_key
        read_only: true
      - type: bind
        source: ${OPSMATE_OFFICE_KNOWN_HOSTS_FILE:?OPSMATE_OFFICE_KNOWN_HOSTS_FILE is required}
        target: /source/office_known_hosts
        read_only: true
      - type: volume
        source: tunnel_secrets
        target: /target
    network_mode: "none"
    read_only: true
    tmpfs:
      - /tmp:size=4m,mode=1777
    cap_drop:
      - ALL
    cap_add:
      - DAC_READ_SEARCH
      - CHOWN
    security_opt:
      - no-new-privileges:true
    logging: *bounded-logging

  model-tunnel:
    image: ${OPSMATE_TUNNEL_IMAGE:?OPSMATE_TUNNEL_IMAGE digest is required}
    restart: "no"
    init: true
    environment:
      OFFICE_SSH_HOST: ${OFFICE_SSH_HOST:?OFFICE_SSH_HOST is required}
      OFFICE_SSH_PORT: ${OFFICE_SSH_PORT:?OFFICE_SSH_PORT is required}
      OFFICE_SSH_USER: ${OFFICE_SSH_USER:?OFFICE_SSH_USER is required}
    volumes:
      - type: volume
        source: tunnel_secrets
        target: /run/secrets
        read_only: true
    expose:
      - "11434"
    networks:
      - model_link
      - tunnel_egress
    depends_on:
      tunnel-secret-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "curl --silent --show-error --fail http://127.0.0.1:11434/api/version >/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s
    read_only: true
    tmpfs:
      - /tmp:size=8m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    logging: *bounded-logging

  app:
    image: ${OPSMATE_APP_IMAGE:?OPSMATE_APP_IMAGE digest is required}
    restart: "no"
    init: true
    environment:
      SPRING_PROFILES_ACTIVE: demo
      OPSMATE_DB_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:?POSTGRES_DB is required}
      OPSMATE_DB_USERNAME: ${OPSMATE_DB_APP_USER:?OPSMATE_DB_APP_USER is required}
      OPSMATE_DB_PASSWORD: ${OPSMATE_DB_APP_PASSWORD:?OPSMATE_DB_APP_PASSWORD is required}
      OPSMATE_BASIC_AUTH_ENABLED: "false"
      OPSMATE_DEMO_ENABLED: "true"
      OPSMATE_DEMO_START_ENABLED: ${OPSMATE_DEMO_START_ENABLED:-false}
      OPSMATE_DEMO_WORKSPACE_TTL: ${OPSMATE_DEMO_WORKSPACE_TTL:-30m}
      OPSMATE_DEMO_CLEANUP_INTERVAL: ${OPSMATE_DEMO_CLEANUP_INTERVAL:-10m}
      OPSMATE_DEMO_MAX_ACTIVE_WORKSPACES: ${OPSMATE_DEMO_MAX_ACTIVE_WORKSPACES:-100}
      OPSMATE_DEMO_ADMISSION_WINDOW: ${OPSMATE_DEMO_ADMISSION_WINDOW:-1h}
      OPSMATE_DEMO_MAX_STARTS_GLOBAL: ${OPSMATE_DEMO_MAX_STARTS_GLOBAL:-200}
      OPSMATE_LLM_ENABLED: "true"
      OPSMATE_LLM_BASE_URL: ${OPSMATE_LLM_BASE_URL:?OPSMATE_LLM_BASE_URL is required}
      OPSMATE_LLM_ALLOWED_HOSTS: ${OPSMATE_LLM_ALLOWED_HOSTS:?OPSMATE_LLM_ALLOWED_HOSTS is required}
      OPSMATE_LLM_MODEL: ${OPSMATE_LLM_MODEL:?OPSMATE_LLM_MODEL is required}
      OPSMATE_LLM_AUTH_TOKEN: ${OPSMATE_LLM_AUTH_TOKEN:-}
      OPSMATE_LLM_MAX_OUTPUT_TOKENS: ${OPSMATE_LLM_MAX_OUTPUT_TOKENS:-512}
      OPSMATE_LLM_MAX_RESPONSE_BYTES: ${OPSMATE_LLM_MAX_RESPONSE_BYTES:-65536}
      OPSMATE_MODEL_MAX_CONCURRENT: "1"
      OPSMATE_MODEL_QUEUE_WAIT: ${OPSMATE_MODEL_QUEUE_WAIT:-2s}
      OPSMATE_MODEL_RATE_WINDOW: ${OPSMATE_MODEL_RATE_WINDOW:-1h}
      OPSMATE_MODEL_MAX_REQUESTS_PER_WORKSPACE: ${OPSMATE_MODEL_MAX_REQUESTS_PER_WORKSPACE:-10}
      OPSMATE_MODEL_MAX_REQUESTS_GLOBAL: ${OPSMATE_MODEL_MAX_REQUESTS_GLOBAL:-100}
      OPSMATE_MODEL_MAX_FOLLOWERS_PER_FLIGHT: ${OPSMATE_MODEL_MAX_FOLLOWERS_PER_FLIGHT:-5}
      OPSMATE_MODEL_FLIGHT_WAIT: ${OPSMATE_MODEL_FLIGHT_WAIT:-35s}
    expose:
      - "8080"
    networks:
      - app_to_db
      - edge_to_app
      - model_link
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      model-tunnel:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl --silent --show-error --fail http://127.0.0.1:8080/actuator/health/readiness >/dev/null"]
      interval: 5s
      timeout: 3s
      retries: 24
      start_period: 20s
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    logging: *bounded-logging

  edge:
    image: nginx:1.30.4-alpine@sha256:97d490c12ba55b4946b01546d1c3ed324e8d41ab1c9fcb2a616aa470620e5b46
    restart: "no"
    user: "101:101"
    ports:
      - "127.0.0.1:${OPSMATE_EDGE_HOST_PORT:-18083}:8080"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - edge_to_app
      - edge_ingress
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/edge-health"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    logging: *bounded-logging

networks:
  edge_to_app:
    internal: true
  # Synology Docker does not materialize a published host port for a container
  # attached only to an internal bridge. This second bridge permits DSM loopback
  # ingress while disabling IP masquerading so the edge has no general IPv4 egress.
  edge_ingress:
    driver: bridge
    driver_opts:
      com.docker.network.bridge.enable_ip_masquerade: "false"
  app_to_db:
    internal: true
  model_link:
    internal: true
  tunnel_egress:

volumes:
  postgres_data:
    name: ${COMPOSE_PROJECT_NAME:-opsmate-demo}-postgres-data
  tunnel_secrets:
    name: ${COMPOSE_PROJECT_NAME:-opsmate-demo}-tunnel-secrets
