spring:
  application:
    name: opsmate-local
  datasource:
    url: jdbc:h2:mem:opsmate;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password: ""
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: false
    placeholders:
      appRole: PUBLIC
  h2:
    console:
      enabled: false

server:
  shutdown: graceful
  error:
    include-message: never

spring.lifecycle.timeout-per-shutdown-phase: 30s

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true

opsmate:
  security:
    basic-enabled: ${OPSMATE_BASIC_AUTH_ENABLED:true}
    requester-password: ${OPSMATE_REQUESTER_PASSWORD:}
    approver-password: ${OPSMATE_APPROVER_PASSWORD:}
    buyer-password: ${OPSMATE_BUYER_PASSWORD:}
    auditor-password: ${OPSMATE_AUDITOR_PASSWORD:}
  llm:
    enabled: ${OPSMATE_LLM_ENABLED:false}
    base-url: ${OPSMATE_LLM_BASE_URL:http://127.0.0.1:11434}
    allowed-hosts: ${OPSMATE_LLM_ALLOWED_HOSTS:127.0.0.1,localhost}
    model: ${OPSMATE_LLM_MODEL:}
    auth-token: ${OPSMATE_LLM_AUTH_TOKEN:}
    connect-timeout: 2s
    read-timeout: 30s
    max-output-tokens: ${OPSMATE_LLM_MAX_OUTPUT_TOKENS:512}
    max-response-bytes: ${OPSMATE_LLM_MAX_RESPONSE_BYTES:65536}
  demo:
    enabled: ${OPSMATE_DEMO_ENABLED:false}
    start-enabled: ${OPSMATE_DEMO_START_ENABLED:false}
    workspace-ttl: ${OPSMATE_DEMO_WORKSPACE_TTL:30m}
    cleanup-interval: ${OPSMATE_DEMO_CLEANUP_INTERVAL:10m}
    max-active-workspaces: ${OPSMATE_DEMO_MAX_ACTIVE_WORKSPACES:100}
    admission-window: ${OPSMATE_DEMO_ADMISSION_WINDOW:1h}
    max-starts-global: ${OPSMATE_DEMO_MAX_STARTS_GLOBAL:200}
  model-guard:
    max-concurrent: ${OPSMATE_MODEL_MAX_CONCURRENT:1}
    queue-wait: ${OPSMATE_MODEL_QUEUE_WAIT:2s}
    workspace-window: ${OPSMATE_MODEL_RATE_WINDOW:1h}
    max-requests-per-workspace: ${OPSMATE_MODEL_MAX_REQUESTS_PER_WORKSPACE:10}
    max-requests-global: ${OPSMATE_MODEL_MAX_REQUESTS_GLOBAL:100}
    max-followers-per-flight: ${OPSMATE_MODEL_MAX_FOLLOWERS_PER_FLIGHT:5}
    flight-wait: ${OPSMATE_MODEL_FLIGHT_WAIT:35s}
