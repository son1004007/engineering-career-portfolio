title: "손기석 | Software / Backend / Platform Engineer"
description: "업무 문제를 시스템으로 구조화하고 AI와 적절한 기술을 활용해 구현·검증·운영까지 연결하는 엔지니어 포트폴리오"
url: "https://son1004007.github.io"
baseurl: "/engineering-career-portfolio"
repository: "son1004007/engineering-career-portfolio"
lang: "ko-KR"
timezone: "Asia/Seoul"

author:
  name: "손기석"
  github: "son1004007"

markdown: kramdown
kramdown:
  input: GFM
  syntax_highlighter: rouge

permalink: /blog/:year/:month/:day/:title/
future: false

defaults:
  - scope:
      path: ""
      type: "pages"
    values:
      layout: "default"
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"
  - scope:
      path: "AI_CONTEXT.md"
    values:
      layout: "document"
      robots: "noindex,follow"
  - scope:
      path: "README.md"
    values:
      layout: "document"
      robots: "noindex,follow"
  - scope:
      path: "HOW_I_ENGINEER.md"
    values:
      layout: "document"
      robots: "index,follow"
  - scope:
      path: "TASKS.md"
    values:
      layout: "document"
      robots: "noindex,follow"
  - scope:
      path: "WORKFLOW.md"
    values:
      layout: "document"
      robots: "noindex,follow"
  - scope:
      path: "WORKS.md"
    values:
      layout: "document"
      robots: "noindex,follow"
  - scope:
      path: "01_profile"
      type: "pages"
    values:
      layout: "document"
      robots: "noindex,follow"
  - scope:
      path: "02_projects"
      type: "pages"
    values:
      layout: "document"
  - scope:
      path: "03_portfolio"
      type: "pages"
    values:
      layout: "document"
      robots: "noindex,follow"
  - scope:
      path: "03_portfolio/case-studies"
      type: "pages"
    values:
      layout: "case-study"
      robots: "index,follow"
  - scope:
      path: "evidence"
      type: "pages"
    values:
      layout: "document"
      robots: "noindex,follow"

exclude:
  - .git
  - .github
  - .venv
  - AGENTS.md
  - Gemfile
  - Gemfile.lock
  - tests
  - tools
  - "**/__pycache__"
  - "**/*.pyc"
