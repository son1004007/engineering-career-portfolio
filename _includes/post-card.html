<article class="post-card">
  <div class="post-card__meta">
    <time datetime="{{ include.post.date | date_to_xmlschema }}">{{ include.post.date | date: "%Y.%m.%d" }}</time>
    {% if include.post.status %}{% include status-badge.html status=include.post.status %}{% endif %}
  </div>
  <h3><a href="{{ include.post.url | relative_url }}">{{ include.post.title }}</a></h3>
  <p>{{ include.post.excerpt | strip_html | strip_newlines }}</p>
  <a class="text-link" href="{{ include.post.url | relative_url }}" aria-label="{{ include.post.title }} 읽기">기록 읽기 <span aria-hidden="true">→</span></a>
</article>
