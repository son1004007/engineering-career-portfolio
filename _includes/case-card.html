<article class="case-card">
  <div class="case-card__topline">
    {% include status-badge.html status=include.status %}
  </div>
  <h3><a href="{{ include.href | relative_url }}">{{ include.title }}</a></h3>
  <p>{{ include.description }}</p>
  {% if include.focus %}<p class="case-card__focus"><strong>핵심:</strong> {{ include.focus }}</p>{% endif %}
  <a class="text-link" href="{{ include.href | relative_url }}" aria-label="{{ include.title }} 자세히 보기">사례 읽기 <span aria-hidden="true">→</span></a>
</article>
